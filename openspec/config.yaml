schema: sb-custom

# ВНИМАНИЕ, следствие этой строки: `openspec templates` БЕЗ `--schema sb-custom`
# покажет не эту схему, а каноническую `spec-driven` — с путями внутрь пакета
# и без артефакта `business`. Команда молчит о подмене: в выводе просто стоит
# `Schema: spec-driven`, и легко решить, что твои правки шаблонов не приехали.
#
# Агента это не касается: воркфлоу ходят через `openspec instructions`, а она
# резолвит схему отсюда сама и вклеивает наши шаблоны. Флаг `--schema` у неё и
# у `openspec status` — это override, и дописывать его туда НЕ надо: устаревшее
# значение перебьёт верный автодетект.

# Впрыскивается в инструкцию КАЖДОГО артефакта (лимит 50 КБ). Единственное
# место конфига, которое видно на всех стадиях, — поэтому здесь только
# указатели и то, что нельзя не знать при написании любого артефакта.
# Сами документы держим файлами: их видно в диффе ревью, а конфиг не
# превращается в документ.
context: |
  Бизнес-знание проекта живёт в `openspec/business/` и переживает архивацию
  change'ей. ПЕРЕД написанием любого артефакта открой:
    - `openspec/business/glossary.md` — термины предметной области. Имя
      сущности берётся отсюда и едет в спеки, таблицы, ручки и подписи в UI
      без переименований. Термина нет в глоссарии — он заводится там,
      в `business.md` текущего change'а, а не изобретается в спеке.
    - `openspec/business/requirements.md` — действующие бизнес-требования.
    - `openspec/business/README.md` — как устроен бизнес-слой целиком:
      дельта в change'е, живое дерево, ручной перенос при архивации.

  Идентификатор бизнес-требования — `БТ/<имя change'а>/<номер>`, например
  `БТ/sales-plan-create/1`. Имя change'а — дословно имя папки в
  `openspec/changes/`. Нумерация начинается с 1 внутри каждого change'а.
  Префикс не переиспользуется и не меняется: он указывает на change,
  в котором требование родилось. Ссылка на требование пишется
  идентификатором целиком, без сокращений.

# Правила артефактов. Как и в guidance ниже, многострочные элементы —
# блочные скаляры `>-`: в plain-строке YAML двоеточие с пробелом превращает
# элемент списка в map, и OpenSpec молча отбрасывает всю секцию.
rules:
  business:
    - >-
      единица измерения величины называется явно (штуки, деньги, часы,
      обращения) и держится одна на весь артефакт. Величина, у которой
      единица подразумевается молча, ломает всю арифметику ниже по течению
      и вскрывается только на реализации
    - >-
      требование, ограниченное возможностями модели или внешнего источника,
      называет это ограничение прямо в формулировке. «План на любой период»
      и «план на горизонт модели» — разные требования, и разница видна
      бизнесу, а не только разработчику
    - >-
      каждое `БТ/<change>/<N>` несёт «Зачем» — решение человека, которое
      требование обеспечивает. Требование, у которого «Зачем» не пишется,
      скорее всего придумано из интерфейса, а не из работы специалиста
    - >-
      `business.md` пишется ПОСЛЕ чтения `openspec/business/glossary.md` и
      `openspec/business/requirements.md`. Термин или требование, уже
      описанные там и не меняющиеся, в дельте не повторяются: вторая копия
      расходится с первой на следующем же change'е
    - >-
      меняя чужое требование, сохраняй его исходный идентификатор и пиши
      полный новый текст, а не дифф. Новый номер завёл бы второе требование
      вместо правки первого, а частичный текст потеряет детали при переносе
      в живой реестр
    - >-
      отказ от бизнес-стадии оформляется одной строкой «Изменение не трогает
      бизнес-процесс: <причина>.» и удалением всех секций. Пустые заголовки
      не оставлять: пустая секция неотличима от забытой
  proposal:
    - Always include justification why we make the proposal
    - >-
      перед написанием открой `openspec/architecture/axioms/SKILL.md`, режим
      proposal. В Impact одной-двумя фразами — какие решения change'а вероятно
      изменятся и где пройдёт граница вокруг них, и что сознательно НЕ выносим
      в абстракцию. Ось изменений берётся из business.md, а не из воображения:
      абстракция под изменение, которого никто не ждёт — косвенность без выгоды
  design:
    - >-
      имя сущности ведётся от того, чем она является в предметной области,
      а не от того, как она устроена внутри. `sales_plan` называл строку
      таблицы и молчал про версии, источник и период действия;
      `plan_document` называет документ плана — то, чем сущность является
      на самом деле, и версии у документа появляются естественно. Имя,
      принятое в design, дальше едет в tasks, код и URL ручек, поэтому
      спорить о нём поздно будет уже на реализации
    - >-
      решение, вводящее компонент в поток данных, называет и то, что через
      него НЕ проходит. «Версия плана ссылается на модель, но не на
      конкретный прогноз» — одна фраза, снимающая неверную картинку
      у следующего читателя
    - >-
      ограничение, заметное пользователю, называется отдельным абзацем, даже
      когда оно следствие сознательно отложенной фичи. «Автосохранение
      не входит в фазу» и «перезагрузка страницы теряет внесённые правки» —
      разные утверждения; второе надо писать вслух
    - >-
      если происходят изменения в структуре БД, или создаются новые сущности
      обязан быть DDL c комментариями ко всем колонкам; анализ объёмов данных,
      решения по индексам, если они требуются; перечисление возможных значений
      для enum
    - >-
      перед написанием открой `openspec/architecture/axioms/SKILL.md`, режим
      design. Решение о границе модуля называет, какое решение он прячет
      и куда направлена зависимость; слой или абстракция помечается аксиомой,
      которая его оправдывает. Отвергнутая абстракция записывается в Risks /
      Trade-offs с причиной — как и отказ от индекса, чтобы следующий читатель
      не заводил её заново
    - >-
      если change вводит внешнюю зависимость (база, внешний API, SDK, очередь,
      файловый или сетевой ввод-вывод), открой
      `openspec/architecture/dependency-inversion/SKILL.md`, режим design.
      В Decisions для каждой такой зависимости — протокол в словах домена,
      модуль, где он лежит, реализация и точка сборки; либо одна фраза, почему
      инверсия здесь не нужна
  tasks:
    - Break tasks into chunks of max 1 hour
    - When task concerns DDL always include comments on tables and fields
    - >-
      каждая задача открывается фронтлайном — одной фразой о назначении
      на языке предмета («расчёт базового варианта плана на выбранный
      период»), и только после неё идут требования к реализации. Голый
      список технических условий нечитаем для того, кто открыл блок
      впервые, а именно он и будет его реализовывать
    - >-
      задача, опирающаяся на неочевидное устройство, ссылается на конкретный
      раздел design.md (design §N) или на пояснительный материал в `docs/`.
      Ссылка «см. design.md» без номера раздела бесполезна
    - >-
      блок задач, вводящий новый механизм, открывается врезкой с терминологией:
      как называется сущность, почему так и где про неё прочитать. Иначе имена
      расползаются между планом, кодом и контрактом наружу
  specs:
    - >-
      сценарий формулируется так, чтобы из него читался вход и наблюдаемый результат;
      если сценарий про поведение модели и unit-тестом не берётся — это помечается прямо в сценарии
    - >-
      поведение, зафиксированное тестом, но не описанное ни одним требованием - это повод завести требование,
      а не оставить тест без сценария
    - >-
      новая capability добавляется в TRACKED в `tests/test_spec_coverage.py`
      (путь поправь под свой проект), иначе её сценарии не попадут ни в отчёт
      покрытия, ни в гейт на архивации
    - Purpose новой capability — развёрнутая версия однострочника из раздела Capabilities в proposal; формулировки не расходятся
    - >-
      предусловие сценария выносится в строку GIVEN, а не остаётся в заголовке
      и не подразумевается из THEN. Неявное предусловие доопределяет тот, кто
      пишет тест: он выбирает один вариант из нескольких возможных, а гейт
      покрытия засчитывает сценарий закрытым целиком
    - >-
      GIVEN называет наблюдаемое состояние, а не способ его получить.
      «дано: версия плана зафиксирована» — состояние; «дано: в plan_version
      строка со status=fixed» — устройство хранения, которое переедет вместе
      со схемой и утащит за собой формулировку требования

# Покрытие сценариев тестами считает `tests/test_spec_coverage.py` (файл лежит
# в `openspec/tools/`, копируется в тестовую папку проекта): знаменатель —
# сценарии спек, числитель — те, на которые сослался тест маркером
# `@pytest.mark.spec("<capability>/<Requirement>/<Scenario>")` либо запись
# в MANUAL (проверка не автотестом, значение — путь к протоколу прогона).
# Элементы guidance — блочные скаляры `>-`: в plain-строке YAML двоеточие с
# пробелом делает из элемента списка map, и OpenSpec молча отбрасывает всю секцию.
operations:
  apply:
    guidance:
      - >-
        написал тест на сценарий — повесь на него
        `@pytest.mark.spec("<capability>/<Requirement>/<Scenario>")`,
        иначе покрытие его не увидит; при этом строка
        "<capability>/<Requirement>/<Scenario>" — это дословное повторение
        того, что написано в спецификации
      - >-
        закрывая блок задач, показывай покрытие сценариев change'а —
        `python -m pytest tests/test_spec_coverage.py -s -q`.
        Это отчёт, а не гейт: непокрытые сценарии по нереализованным блокам — норма
      - >-
        пишешь сервис с внешней зависимостью или тест его бизнес-правила —
        сверься с `openspec/architecture/dependency-inversion/SKILL.md`, режим
        apply. Новая операция сначала дописывается в протокол, потом в
        реализацию и фейк; тест бизнес-правила идёт на фейке по протоколу,
        а не на `Mock(spec=<конкретный класс>)`
  archive:
    guidance:
      - >-
        ДО архивации перенести бизнес-дельту в живое дерево: новые термины из
        `business.md` — в `openspec/business/glossary.md`, требования — в
        `openspec/business/requirements.md` по подсекциям (добавлено /
        изменено / снято). `openspec archive` этого не делает: он сливает
        только дельты спек в `openspec/specs/`, а папку change'а вместе
        с `business.md` целиком уносит в `changes/archive/`
      - >-
        снятое требование не удаляется из `openspec/business/requirements.md`,
        а переезжает в секцию «Снятые» с причиной. Идентификатор остаётся
        занятым навсегда, иначе ссылка из старой спеки укажет в пустоту
      - >-
        не архивировать change, в котором остались сценарии без теста и без записи
        в MANUAL. Архивация переносит требование в `openspec/specs/` навсегда,
        и с этого момента `test_archived_scenarios_are_covered` держит его красным
      - >-
        перечитать MANUAL: расписка о ручной проверке действительна ровно
        настолько, насколько актуален протокол, на который она ссылается
      - >-
        проверить Purpose затронутых capability в `openspec/specs/<capability>/spec.md`.
        Для MODIFIED capability Purpose из дельты игнорируется молча — устаревший
        останется устаревшим
