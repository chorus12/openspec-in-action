# Регистрация маркера покрытия. Без неё pytest сыплет PytestUnknownMarkWarning
# на каждый тест со ссылкой на сценарий, а с --strict-markers падает.
# Сам гейт маркеры читает регуляркой по исходникам и от этой регистрации
# не зависит — она нужна тестам, которые маркеры несут.
[pytest]
markers =
    spec(path): сценарий спеки, который закрывает этот тест — "<capability>/<Requirement>/<Scenario>"
